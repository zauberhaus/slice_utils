# Loaded automatically by gitleaks from the repository root.
title = "github-template"

[extend]
useDefault = true

# .vscode is git-ignored and holds local integration-test credentials. It never
# reaches the repository, but the working-tree scan (gitleaks dir) reads every
# file on disk, ignored or not.
[[allowlists]]
description = "git-ignored local editor settings and Terraform state, including terraform.tfstate.d/ and timestamped backups (they hold the app key)"
paths = ['''^\.vscode/''', '''^terraform/(.*/)?terraform\.tfstate''']
